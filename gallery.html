    <link rel="preconnect" href="https://fonts.googleapis.com" />

            height="138"

        <nav class="flex gap-5 text-sm font-semibold uppercase tracking-widest" aria-label="Main">

        <h1 class="mt-3 text-6xl md:text-7xl">Moments of gratitude</h1>
      </div>

      <div class="mx-auto max-w-6xl columns-2 gap-3 px-5 md:columns-3">
        <img
          src="images/hero.jpg"
          alt="Grateful Experience photo"
          loading="lazy"
          decoding="async"
          width="1024"
          height="1024"
          class="mb-3 aspect-[3/4] w-full rounded-lg object-cover"
        />
        <img
          src="images/g1.jpg"
          alt="Grateful Experience photo"
          loading="lazy"
          decoding="async"
          width="1024"
          height="1024"
          class="mb-3 aspect-square w-full rounded-lg object-cover"
        />
        <img
          src="images/g2.jpg"
          alt="Grateful Experience photo"
          loading="lazy"
          decoding="async"
          width="1024"
          height="1024"
          class="mb-3 aspect-square w-full rounded-lg object-cover"
        />
        <img
          src="images/g1.jpg"
          alt="Grateful Experience photo"
          loading="lazy"
          decoding="async"
          width="1024"
          height="1024"
          class="mb-3 w-full rounded-lg object-cover"

        <img
          src="images/hero.jpg"
          alt="Grateful Experience photo"
          loading="lazy"
          decoding="async"
          width="1024"
          height="1024"
          class="mb-3 aspect-square w-full rounded-lg object-cover"

        <img
          src="images/g2.jpg"
          alt="Grateful Experience photo"
          loading="lazy"
          decoding="async"
          width="1024"
          height="1024"
          class="mb-3 w-full rounded-lg object-cover"
        />
        <img
          src="images/minster1.jpg"
          alt="Minister Michael Mahendere"
          loading="lazy"
          decoding="async"
          width="1536"
          height="2048"
          class="mb-3 aspect-[3/4] w-full rounded-lg object-cover"
        />
      </div>

      <div class="mx-auto max-w-6xl px-5 pt-20">
        <h2 class="text-4xl">Flyers &amp; posters</h2>
        <p class="mt-3 max-w-2xl text-muted-foreground">
          Official artwork for the nights ahead.
        </p>
        <div class="mt-6 grid items-start gap-5 md:grid-cols-3">
          <figure class="overflow-hidden rounded-xl border bg-card">
            <img
              src="images/GEZim.jpg"
              alt="Grateful Experience Zimbabwe 2026 flyer"
              loading="lazy"
              decoding="async"
              width="1600"
              height="1600"
              class="w-full object-cover object-top"
            />
            <figcaption class="p-5">
              <h3 class="text-2xl">Grateful Experience Zimbabwe</h3>
              <p class="mt-1 text-sm text-muted-foreground">
                Harare International Conference Centre, Harare, Zimbabwe
              </p>
              <p class="mt-2 text-sm font-semibold text-primary">05 Dec 2026</p>
            </figcaption>
          </figure>

          <figure class="overflow-hidden rounded-xl border bg-card">
            <img
              src="images/messiahtour2.jpg"
              alt="Messiah UK Tour save the date poster with Minister Michael Mahendere"
              loading="lazy"
              decoding="async"
              width="1256"
              height="1440"
              class="w-full object-cover object-top"
            />
            <figcaption class="p-5">
              <h3 class="text-2xl">Messiah UK Tour</h3>
              <p class="mt-1 text-sm text-muted-foreground">Vaillant Live, Derby, United Kingdom</p>

            />
            <figcaption class="p-5">
              <h3 class="text-2xl">Messiah UK Tour — tickets</h3>
              <p class="mt-1 text-sm text-muted-foreground">Vaillant Live, Derby, United Kingdom</p>
              <p class="mt-2 text-sm font-semibold text-primary">14 Nov 2026 · Doors 12:00</p>
            </figcaption>
          </figure>
