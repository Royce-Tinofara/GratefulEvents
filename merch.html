<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Merch — Grateful Experience</title>
    <meta name="description" content="Official Grateful Experience tees, caps and totes." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Merch — Grateful Experience" />
    <meta
      property="og:description"
      content="Official Grateful Experience tees, caps and totes."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Yellowtail&family=Archivo:wght@400;600;800&display=swap"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="icon" href="images/favicon.png" type="image/png" />
  </head>
  <body>
    <header class="sticky top-0 z-30 border-b bg-background/85 backdrop-blur">
      <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 px-5 py-4">
        <a href="index.html"
          ><img
            src="images/ge-logo.png"
            alt="Grateful Events"
            width="543"
            height="138"
            class="h-9 w-auto"
        /></a>
        <nav class="flex gap-5 text-sm font-semibold uppercase tracking-widest" aria-label="Main">
          <a href="events.html" class="text-muted-foreground hover:text-primary">Events</a>
          <a href="gallery.html" class="text-muted-foreground hover:text-primary">Gallery</a>
          <a href="merch.html" class="text-primary" aria-current="page">Merch</a>
          <a href="about.html" class="text-muted-foreground hover:text-primary">About</a>
        </nav>
      </div>
    </header>

    <main>
      <div class="mx-auto max-w-6xl px-5 pt-16 pb-10">
        <p class="text-xs uppercase tracking-[0.3em] text-primary">Merch</p>
        <h1 class="mt-3 text-6xl md:text-7xl">Wear your gratitude</h1>
        <p class="mt-4 max-w-2xl text-muted-foreground">
          Available at events, or order by message.
        </p>
      </div>

      <div class="mx-auto grid max-w-6xl gap-5 px-5 md:grid-cols-3">
        <article class="overflow-hidden rounded-xl border bg-card">
          <img
            src="images/merch.jpg"
            alt="Grateful Tee"
            loading="lazy"
            decoding="async"
            width="1024"
            height="1024"
            class="aspect-square w-full object-cover"
          />
          <div class="flex items-center justify-between p-5">
            <div>
              <h2 class="text-2xl">Grateful Tee</h2>
              <p class="text-primary">$20</p>
            </div>
            <a
              href="https://www.facebook.com/eleanabandamakombe"
              target="_blank"
              rel="noreferrer"
              class="inline-flex items-center rounded-sm border border-primary px-6 py-3 text-sm font-semibold uppercase tracking-widest text-primary hover:bg-primary/10"
              >Order</a
            >
          </div>
        </article>

        <article class="overflow-hidden rounded-xl border bg-card">
          <img
            src="images/merch.jpg"
            alt="Grateful Cap"
            loading="lazy"
            decoding="async"
            width="1024"
            height="1024"
            class="aspect-square w-full object-cover"
          />
          <div class="flex items-center justify-between p-5">
            <div>
              <h2 class="text-2xl">Grateful Cap</h2>
              <p class="text-primary">$15</p>
            </div>
            <a
              href="https://www.facebook.com/eleanabandamakombe"
              target="_blank"
              rel="noreferrer"
              class="inline-flex items-center rounded-sm border border-primary px-6 py-3 text-sm font-semibold uppercase tracking-widest text-primary hover:bg-primary/10"
              >Order</a
            >
          </div>
        </article>

        <article class="overflow-hidden rounded-xl border bg-card">
          <img
            src="images/merch.jpg"
            alt="Grateful Tote"
            loading="lazy"
            decoding="async"
            width="1024"
            height="1024"
            class="aspect-square w-full object-cover"
          />
          <div class="flex items-center justify-between p-5">
            <div>
              <h2 class="text-2xl">Grateful Tote</h2>
              <p class="text-primary">$12</p>
            </div>
            <a
              href="https://www.facebook.com/eleanabandamakombe"
              target="_blank"
              rel="noreferrer"
              class="inline-flex items-center rounded-sm border border-primary px-6 py-3 text-sm font-semibold uppercase tracking-widest text-primary hover:bg-primary/10"
              >Order</a
            >
          </div>
        </article>
      </div>
    </main>

    <footer class="mt-24 border-t">
      <div
        class="mx-auto flex max-w-6xl flex-col justify-between gap-2 px-5 py-8 text-sm text-muted-foreground sm:flex-row"
      >
        <p>© 2026 Grateful Events · Powered by PYNE-APP</p>
        <a
          href="https://www.facebook.com/eleanabandamakombe"
          target="_blank"
          rel="noreferrer"
          class="hover:text-primary"
          >Follow on Facebook →</a
        >
      </div>
    </footer>
  </body>
</html>
