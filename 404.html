<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Grateful Experience</title>
    <meta name="description" content="The page you're looking for doesn't exist or has been moved." />
    <meta name="robots" content="noindex" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Yellowtail&family=Archivo:wght@400;600;800&display=swap"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="icon" href="images/favicon.png" type="image/png" />
  </head>
  <body>
    <main>
      <div class="flex min-h-screen items-center justify-center bg-background px-4">
        <div class="max-w-md text-center">
          <h1 class="text-7xl font-bold text-foreground">404</h1>
          <h2 class="mt-4 text-xl font-semibold text-foreground">Page not found</h2>
          <p class="mt-2 text-sm text-muted-foreground">
            The page you're looking for doesn't exist or has been moved.
          </p>
          <div class="mt-6">
            <a
              href="index.html"
              class="inline-flex items-center justify-center rounded-md bg-primary px-4 py-2 text-sm font-medium text-primary-foreground transition-colors hover:bg-primary/90"
              >Go home</a
            >
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
